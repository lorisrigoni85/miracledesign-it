name: Telepass, 2019 – oggi
title: Rendere più semplice il modo in cui ci muoviamo.
lead: "Dal 2019 lavoro sui prodotti web di Telepass: prima in agenzia, poi in azienda, oggi in consulenza. Dalla prima mappa del sito alle scelte che oggi ne guidano la crescita: quattro momenti di un percorso ancora in corso."
mockupAlt: Il sito telepass.com su computer e su telefono

