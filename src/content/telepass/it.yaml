navLabel: Momenti

moments:
  - id: mappare
    year: "2019"
    short: Mappare
    where: Wise Emotions
    title: Imparare a conoscere tutto, pezzo per pezzo.
    text:
      - "In Wise Emotions fin da subito ho avuto modo di lavorare su Telepass, partendo da una mappatura completa dei loro portali: circa 40 componenti e 16 template, ognuno con la sua funzione, i suoi pregi e le limitazioni che potevano essere migliorate."
      - Quella mappa è diventata poi la base del design system costruito in seguito.
    principle: Formalizzare, per rendere condivisibile.
    diagram: map
  - id: ascoltare
    year: "2022 – 23"
    short: Ascoltare
    where: Telepass
    title: Ascoltare prima di ridisegnare.
    text:
      - "Prima di ridisegnare qualsiasi cosa abbiamo ascoltato chi il sito lo vive ogni giorno: le figure di riferimento del business e i manager dei team interni, senza tralasciare 12 utenti, clienti e non, tra interviste e test di usabilità."
      - "I workshop, poi, si sono confermati lo strumento perfetto per mettere allo stesso tavolo business e team di prodotto, e trasformare la nostra analisi in priorità condivise."
    principle: Ogni progetto successivo risponde a una di queste priorità.
    diagram: research
  - id: ridisegnare
    year: "2024"
    short: Ridisegnare
    where: Telepass
    title: Rinnovare senza ricominciare da zero.
    text:
      - Il redesign di telepass.com è partito dal design system già in uso, perché sul sito lavorano più team ogni giorno.
      - "Un solo carattere tipografico, i colori del brand e una libreria più snella: sei tipi di card diventati tre."
    principle: Meno componenti, più flessibili.
    diagram: cards
  - id: conversione
    year: "2026"
    short: Conversione
    where: Dst per Telepass
    title: Mettere il design al servizio del business.
    text:
      - "Con Dst il lavoro si sposta sulla conversione: ogni pagina deve accompagnare chi la visita al passo successivo."
      - La pagina offerta riconosce chi arriva e chi è già cliente, e cambia racconto. Il sito porta verso l’app nei momenti giusti, con un’azione chiara che non perde il contesto, sul computer come sul telefono.
    principle: Un’azione, non una scelta.
    diagram: business

