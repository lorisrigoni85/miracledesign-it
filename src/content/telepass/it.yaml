moments:
  - id: mappare
    year: "2019"
    short: Mappare
    where: Wise Emotions
    title: Imparare a conoscere tutto, pezzo per pezzo.
    text:
      - "In Wise Emotions fin da subito ho avuto modo di lavorare su Telepass, partendo da una mappatura completa dei loro portali: circa 40 componenti e 16 template, ognuno con la sua funzione, i suoi pregi e i limiti che si potevano migliorare."
      - Quella mappa è diventata la base del design system che avremmo costruito negli anni successivi.
    principle: Formalizzare, per rendere condivisibile.
    diagram: map
  - id: ascoltare
    year: "2022 – 23"
    short: Ascoltare
    where: Telepass
    title: Ascoltare prima di ridisegnare.
    text:
      - "Prima di ridisegnare qualsiasi cosa abbiamo ascoltato chi il sito lo vive ogni giorno: le figure di riferimento del business e i manager dei team interni, senza tralasciare 12 utenti, clienti e non, tra interviste e test di usabilità."
      - "I workshop, poi, si sono confermati lo strumento perfetto per mettere allo stesso tavolo business e team di prodotto, e trasformare la nostra analisi in priorità condivise."
    principle: Ogni progetto successivo risponde a una di queste priorità.
    diagram: research
  - id: ridisegnare
    year: "2024"
    short: Ridisegnare
    where: Telepass
    title: Rinnovare senza ricominciare da zero.
    text:
      - "Il redesign di telepass.com è stato il cuore del mio lavoro in Telepass, e da lì è nato Resin, il design system del sito."
      - "Siamo partiti dalle fondamenta: una library di foundation con i design token, i colori primitivi, la tipografia, le icone e le illustrazioni. Sopra, due UI Kit distinti, uno per il web e uno per l’app, che condividono le stesse regole ma rispondono a contesti diversi."
      - "Con queste basi abbiamo potuto semplificare: un solo carattere tipografico, i colori del brand usati in modo coerente e una libreria più snella. Le card, per esempio, erano di sei tipi diversi, nati negli anni per esigenze diverse: sono diventate tre, più flessibili, capaci di coprire gli stessi casi."
      - "Poi la parte più delicata: sostituire i componenti uno alla volta, con il sito sempre online. Ogni rilascio andava coordinato con il data entry dei contenuti e con i test QA, perché sul sito lavorano più team ogni giorno e nessuno doveva fermarsi."
    principle: Meno componenti, più flessibili.
    diagram: cards
  - id: conversione
    year: "2026"
    short: Conversione
    where: Dst per Telepass
    title: Il design al servizio del business.
    text:
      - "Con Dst il lavoro si sposta sulla conversione: ogni pagina deve accompagnare chi la visita al passo successivo."
      - "La pagina di un’offerta, per esempio, riconosce se chi arriva è un nuovo visitatore o già un cliente, e racconta cose diverse. E il sito porta verso l’app nei momenti giusti, con un’azione chiara, sul computer come sul telefono."
    principle: Un’azione, non una scelta.
    diagram: business

