navLabel: Moments

moments:
  - id: mapping
    year: "2019"
    short: Mapping
    where: Wise Emotions
    title: Before designing, understand what is there.
    text:
      - "As soon as I joined Wise Emotions, before designing anything, I mapped the public area of telepass.com: around 40 components and 16 templates, each with its role, its purpose and what needed fixing."
      - That map became the foundation of the design system built afterwards.
    principle: Make it explicit, so it can be shared.
    diagram: map
  - id: listening
    year: 2022-23
    short: Listening
    where: Telepass
    title: Listening before redesigning.
    text:
      - "Before the redesign we listened to the people who live with the site every day: 8 people from internal teams and 12 users, customers and not, through interviews and usability tests."
      - A workshop with the team turned what we had heard into shared priorities.
    principle: Every project that followed answers one of these priorities.
    diagram: research
  - id: redesigning
    year: "2024"
    short: Redesigning
    where: Telepass
    title: Renewing without starting over.
    text:
      - The telepass.com redesign started from the design system already in use, because several teams work on the site every day.
      - "One typeface, the brand colours and a leaner library: six kinds of card became three."
    principle: Fewer components, more flexible.
    diagram: cards
  - id: business
    year: "2026"
    short: Business
    where: Dst for Telepass
    title: Putting design at the service of the business.
    text:
      - "With Dst the work shifts to conversion: every page has to lead its visitors to the next step."
      - The offer page recognises newcomers and existing customers and tells each a different story. The site leads to the app at the right moments, with a clear action that keeps the context, on desktop as on mobile.
    principle: One action, not a choice.
    diagram: business

