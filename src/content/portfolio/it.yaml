# Caso studio "Questo portfolio" in italiano. Testo approvato da Loris il 30/10/2026 (bozza in BOZZA-CASO-1.md).
# I numeri vengono dalla storia git del repository e dal rapporto Analytics del 19–25 ottobre 2026.

