    label: dalla specifica al sito online
  - value: 105 salvataggi
    label: 43 in una sola sera
  - value: Claude Code
    label: con Astro, GitHub Pages e Google Analytics 4

navLabel: Cinque momenti
moments:
  - id: specifica
    year: Fase 01
    short: La specifica
    where: Claude
    title: Prima la specifica, poi il codice.
    text:
      - "Prima di scrivere una riga ho scritto le regole. In una chat con Claude ho messo nero su bianco **posizionamento, pubblico, i tre argomenti** da sostenere (sistemi che durano, design guidato da ricerca e dati, un profilo ibrido tra design e codice), la mappa del sito e i testi di ogni sezione."
      - "Il documento diventa la **fonte unica**: l'agente lo legge per primo, e dove una decisione è aperta deve chiedere, non inventare. I segnaposto restano tra parentesi quadre finché non ho un dato vero."
    principle: A un agente si danno regole, non solo richieste.
    diagram: spec
  - id: ciclo
    year: Fase 02
    short: Il ciclo
    where: Claude Code
    title: "Il ciclo: chiedo, guardo, correggo."
    text:
      - "Il lavoro vero è un **ciclo corto**. Chiedo una modifica, la guardo nel browser, la correggo o la approvo."
      - "In una sola sera ci sono **43 salvataggi**: logo, header, piè di pagina, archivio, menu, pagina CV. Ogni salvataggio è una decisione piccola e reversibile."
    principle: Tanti passi piccoli che si vedono, invece di una consegna grande.
    diagram: loop
  - id: scelte
    year: Fase 03
    short: Le scelte
    where: Direzione di design
    title: Le scelte che sono rimaste mie.
    text:
      - "L'agente propone, ma il giudizio di design non si delega. Spesso è servito **correggere il tiro**: sul lessico, sulla leggibilità dei testi, sul taglio delle informazioni. A volte l'agente divagava, aggiungeva più del necessario o spiegava troppo, e il lavoro era riportarlo all'essenziale."
    list:
      - title: Il logo.
        text: "Il file originale non esisteva più: è stato ricostruito in vettoriale dal vecchio png. L'ho fatto correggere finché le lettere non erano coerenti con il corsivo originale."
      - title: L'apertura della Home.
        text: Una specifica iniziale prevedeva fin da subito la menzione al percorso in Telepass e Dst. Ho optato per un'apertura più di contesto a schermo intero, con nome e cognome come titolo.
      - title: Raccontare il caso Telepass.
        text: "La mappatura iniziale prevedeva una pagina madre e cinque capitoli. Vista costruita era troppo frammentata: è diventata una pagina unica con quattro momenti e un indice che segue lo scorrimento."
      - title: Accessibilità.
        text: Contrasto minimo corretto su anni ed etichette dove il grigio era troppo chiaro.
    principle: L'AI accelera l'esecuzione, la direzione resta umana.
    diagram: choices
  - id: online
    year: Fase 04
    short: Online
    where: GitHub Pages · Aruba
    title: Messa online, senza rompere niente.
    text:
      - "Le decisioni tecniche sono state ponderate rispetto ai sistemi già in uso, con un **tocco di innovazione**:"
    list:
      - title: Hosting.
        text: "Netlify è stato accantonato perché con il piano gratuito il sito si sarebbe fermato a crediti esauriti; l'FTP corrente di Aruba avrebbe richiesto ogni volta l'autorizzazione dell'indirizzo IP. La scelta è ricaduta su GitHub Pages: gratuito, ogni salvataggio pubblicato in automatico."
      - title: Dominio e posta.
        text: "Restano su Aruba: ho cambiato solo i record del sito, senza toccare quelli della posta."
      - title: HTTPS.
        text: "Il certificato non partiva: i server DNS di Aruba non erano ancora allineati. Abbiamo aspettato e poi forzato una nuova richiesta."
      - title: Privacy.
        text: "Google Analytics parte solo dopo il consenso, con Signals e dati pubblicitari spenti già nel codice."
    principle: Non serve saper scrivere il codice, serve capire cosa si sta decidendo.
    diagram: pipeline
  - id: misurare
    year: Fase 05
    short: Misurare
    where: Google Analytics 4
    title: Misurare.
    text:
      - "Un sito di portfolio senza misura è un'opinione. Con l'agente ho scritto uno script che ogni settimana legge i dati di Google Analytics e produce un breve rapporto: **5 numeri, 3 osservazioni, 1 suggerimento**."
      - "Prima settimana online: 39 visitatori, quasi un minuto e mezzo a testa, la pagina Telepass letta oltre il 90% da 10 persone. **LinkedIn** è il canale che porta più visite dopo i link diretti. I dati hanno mostrato anche cosa mancava: i click sull'email non venivano contati, e li ho aggiunti."
    principle: Progettare, pubblicare, misurare, correggere. Anche per il proprio sito.
    diagram: report

