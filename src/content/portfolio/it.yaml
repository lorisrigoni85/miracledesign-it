learned:
  label: Cosa ho imparato
  intro: "Da mesi vedo, in azienda e nel mondo digitale, quanto l'AI stia entrando nel lavoro di prodotto e soprattutto nella progettazione. Volevo capirlo **sporcandomi le mani**, non per sentito dire."
  points:
    - title: Serve un capitano.
      text: "L'agente è veloce e instancabile, ma tende a divagare. Il valore sta nel tenere la rotta: cosa dire, a chi, con quali parole."
    - title: La specifica conta più del prompt.
      text: Il tempo speso a scrivere le regole prima è tornato indietro moltiplicato.
    - title: Il ruolo si sposta verso la strategia.
      text: "Meno tempo sull'esecuzione, più tempo su posizionamento, contenuti e scelte. In questa fase della mia carriera è proprio il livello su cui voglio lavorare."
  repo: Il codice del sito su GitHub
