learned:
  label: What I learned
  intro: "For months I've seen, at work and across the digital world, how much AI is entering product work and above all design. I wanted to understand it by **getting my hands dirty**, not by hearsay."
  points:
    - title: It needs a captain.
      text: "The agent is fast and tireless, but it tends to wander. The value is in holding the course: what to say, to whom, in which words."
    - title: The spec matters more than the prompt.
      text: The time spent writing the rules up front came back many times over.
    - title: The role shifts towards strategy.
      text: "Less time on execution, more time on positioning, content and choices. At this stage of my career, that's exactly the level I want to work at."
  repo: The site's code on GitHub
