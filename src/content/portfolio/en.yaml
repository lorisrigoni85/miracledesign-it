# "This portfolio" case study in English: an adaptation of it.yaml, approved by Loris on 30/10/2026.
# Numbers come from the repository's git history and the Analytics report for 19–25 October 2026.

meta:
  title: The new portfolio, designed by me and built with an AI agent — Loris Rigoni | Miracle Design
  description: "How Loris Rigoni redesigned miracledesign.it and put it online in eight days by directing Claude Code: the spec, the working loop with the agent, design choices, going live and measuring."

name: miracledesign.it
title: A new portfolio, designed by me and built with an AI agent.
lead: "The old miracledesign.it was a gallery of projects from 2016 to 2020. I redesigned it efficiently, updating it with the experience of recent years, and finally published it, directing everything with Claude Code."
mockupAlt: The miracledesign.it website on desktop and mobile
facts:
  - value: 8 days
    label: from the spec to the live site
  - value: 105 commits
    label: 43 in a single evening
  - value: Claude Code
    label: with Astro, GitHub Pages and Google Analytics 4

navLabel: Five moments
moments:
  - id: spec
    year: Phase 01
    short: The spec
    where: Claude
    title: The spec first, then the code.
    text:
      - "Before writing a line, I wrote the rules. In a chat with Claude I set down **positioning, audience, the three arguments** to make (systems that last, design driven by research and data, a hybrid profile between design and code), the site map and the copy for every section."
      - "The document becomes the **single source of truth**: the agent reads it first, and where a decision is still open it has to ask, not invent. Placeholders stay in square brackets until I have real data."
    principle: You give an agent rules, not just requests.
    diagram: spec
  - id: loop
    year: Phase 02
    short: The loop
    where: Claude Code
    title: "The loop: ask, look, correct."
    text:
      - "The real work is a **short loop**. I ask for a change, look at it in the browser, then correct or approve it."
      - "In a single evening there are **43 commits**: logo, header, footer, archive, menu, CV page. Each commit is a small, reversible decision."
    principle: Many small visible steps instead of one big delivery.
    diagram: loop
  - id: choices
    year: Phase 03
    short: The choices
    where: Design direction
    title: The choices that stayed mine.
    text:
      - "The agent proposes, but design judgement can't be delegated. I often had to **course-correct**: on vocabulary, on readability, on how information was cut. Sometimes the agent wandered off, added more than needed or over-explained, and the job was to bring it back to the essentials."
    list:
      - title: The logo.
        text: "The original file no longer existed: it was rebuilt as a vector from the old png. I had it corrected until the letters matched the original script."
      - title: The Home opening.
        text: An early spec called for mentioning my path at Telepass and Dst right away. I went for a full-screen opening with more context, with my first and last name as the headline.
      - title: Telling the Telepass story.
        text: "The initial mapping had a parent page and five chapters. Once built, it felt too fragmented: it became a single page with four moments and an index that follows the scroll."
      - title: Accessibility.
        text: Minimum contrast fixed on years and labels where the grey was too light.
    principle: AI speeds up execution, direction stays human.
    diagram: choices
  - id: live
    year: Phase 04
    short: Live
    where: GitHub Pages · Aruba
    title: Going live without breaking anything.
    text:
      - "The technical decisions were weighed against the systems already in use, with a **touch of innovation**:"
    list:
      - title: Hosting.
        text: "Netlify was set aside because on the free plan the site would stop once credits ran out; the existing Aruba FTP would have required authorising the IP address every time. The choice fell on GitHub Pages: free, and every commit is published automatically."
      - title: Domain and email.
        text: "They stay on Aruba: I only changed the website records, without touching the email ones."
      - title: HTTPS.
        text: "The certificate wouldn't issue: Aruba's DNS servers weren't in sync yet. We waited, then forced a new request."
      - title: Privacy.
        text: "Google Analytics only starts after consent, with Signals and advertising data switched off in the code."
    principle: You don't need to write the code, you need to understand what you're deciding.
    diagram: pipeline
  - id: measuring
    year: Phase 05
    short: Measuring
    where: Google Analytics 4
    title: Measuring.
    text:
      - "A portfolio site without measurement is an opinion. With the agent I wrote a script that reads Google Analytics data every week and produces a short report: **5 numbers, 3 observations, 1 suggestion**."
      - "First week online: 39 visitors, almost a minute and a half each, the Telepass page read past 90% by 10 people. **LinkedIn** is the channel that brings the most visits after direct links. The data also showed what was missing: email clicks weren't being counted, so I added them."
    principle: Design, publish, measure, correct. Your own site included.
    diagram: report

