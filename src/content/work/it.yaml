  - route: grigna
    image: grigna
    eyebrow: Grigna · design system personale
    title: Un design system per chi progetta e per gli agenti AI.
    text: "Principi, componenti con i loro stati e **accessibilità per costruzione**, con regole scritte per due lettori: le persone e gli agenti. E una prova con e senza sistema."
    tags: [Design system, Accessibilità, AI]
    imageAlt: I bottoni di Grigna nelle loro varianti e nei loro stati
  - route: portfolio
    image: portfolio
    eyebrow: Questo portfolio · ottobre 2026
    title: Progettato da me, costruito con un agente AI.
    text: Il sito che stai guardando, riprogettato e messo online in otto giorni **dirigendo Claude Code**. Dalla specifica alle scelte di design, dalla messa online alla misura settimanale.
    tags: [AI, Claude Code, Direzione di design]
    imageAlt: Il sito miracledesign.it su computer e su telefono

