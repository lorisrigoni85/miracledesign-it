activitiesLabel: What I do
activities:
  - name: Ski mountaineering
    text: From Monte Rosa to the Bernina, and the Tian Shan in Kyrgyzstan.
  - name: Classic alpinism
    text: Normal routes on the 4,000s and the big peaks of Ortler and Bernina.
  - name: Winter gullies
    text: Snow and mixed climbing in the Grigne, Presolana and Orobie.
  - name: High-altitude trekking
    text: Everest base camp, the Caucasus, the Tour du Mont Blanc.

