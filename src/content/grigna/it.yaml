# Caso studio Grigna in italiano: pagina "specimen" (principi, componenti, accessibilità, due lettori, token, esperimento).
# Testo approvato da Loris il 31/10/2026 (bozza in BOZZA-CASO-2.md). Niente date, niente Quotik.
# Fonte dei contenuti: ~/Documents/design-system (docs/principi.md, docs/componenti/, AGENTS.md, esperimento/confronto.md).

meta:
  title: Grigna, un design system per persone e agenti AI — Loris Rigoni | Miracle Design
  description: "Grigna, il design system di Loris Rigoni pensato per chi progetta e per gli agenti AI: principi, componenti con i loro stati, accessibilità per costruzione e un esperimento con e senza sistema."

name: Grigna
label: Design system · progetto personale
title: Grigna. Un design system per chi progetta e per agenti AI.
lead: "Un design system serve prima di tutto a chi progetta: dà a designer e sviluppatori le stesse regole, gli stessi nomi e gli stessi componenti. Grigna aggiunge un secondo lettore, l'agente AI. Le regole che rendono coerente il lavoro di un team sono le stesse che impediscono a un agente di inventare colori, spazi e componenti."
siteLabel: Esplora Grigna
demoTitle: Componenti di Grigna, esempi dal vivo
facts:
  - value: 3 livelli
    label: di token, dal valore grezzo di partenza al componente multifunzione
  - value: 7 componenti iniziali
    label: in HTML e CSS, senza framework, pronti a crescere
  - value: Light e Dark mode
    label: stessi nomi, valori diversi

principles:
  label: Sei principi
  intro: Sei idee guidano Grigna, i principi da tenere sempre alla base per la progettazione e per l'utilizzo dei componenti iniziali. Quando una regola più specifica non copre un caso, si decide partendo da qui.
  items:
    - title: Il sistema è il contesto.
      text: Ogni scelta è scritta, ha un nome ed è verificabile da uno script, non solo da un occhio esperto.
    - title: Pulito e luminoso.
      text: Superfici chiare, molto spazio, un solo colore d'accento. La UI è al servizio dei puri contenuti.
    - title: Il colore ha sempre un significato.
      text: "Il verde abete indica l'azione. Gli altri colori servono solo a dare un riscontro: successo, attenzione, errore o informazione."
    - title: Accessibile per costruzione.
      text: Contrasto, area di tocco e focus sono regole controllate, non buone intenzioni.
    - title: Meno scelte, più coerenza.
      text: "Spazi, misure e colori si scelgono con un razionale. Se un valore manca, non si scrive a mano: si aggiunge al sistema, per tutti."
    - title: Niente contenuti inventati.
      text: "Gli esempi usano segnaposto chiari. E un dato che manca non si mostra: niente trattini, «n.d.» o stime."

components:
  label: Componenti
  intro: "Sette componenti iniziali, in HTML e CSS senza framework. Ogni pagina della documentazione ha le stesse sezioni nello stesso ordine: esempio dal vivo, quando usarlo e quando no, codice, varianti e stati, token, accessibilità, regole per gli agenti."
  hint: Scegli un componente e guarda i suoi stati. Gli esempi sono veri, non immagini.
  theme: Modalità
  light: Light
  dark: Dark
  quote: Ogni componente dice anche quando non usarlo.

a11y:
  label: Accessibile per costruzione
  intro: "L'accessibilità in Grigna non è frutto di una revisione finale: è scritta nei token fin dall'inizio ed è controllata dalla build."
  items:
    - title: Contrasto
      text: 4,5:1 per il testo, 3:1 per bordi e grafica. Se un abbinamento non passa, la build si ferma.
    - title: Area di tocco
      text: Almeno 44px per ogni elemento interattivo.
    - title: Testo
      text: Il testo corrente non scende mai sotto i 16px.
    - title: Focus
      text: Sempre visibile da tastiera, con lo stesso anello verde ovunque.
    - title: HTML nativo
      text: "Un pulsante per le azioni, un link per la navigazione, un'etichetta per ogni campo, details per l'accordion."
    - title: Mai solo colore
      text: Ogni colore con un significato è accompagnato da un testo, un'icona o una forma.
  toggle: Guarda senza colori
  toggleHint: "Prova a togliere i colori: lo stato dei badge, il filtro attivo e l'errore si capiscono lo stesso, grazie a testo, spunta e messaggio."
  quote: Un'informazione che passa solo dal colore non arriva a tutti.

readers:
  label: Un DS anche per agenti AI
  intro: "Le pagine della documentazione si chiudono con una sezione «Per gli agenti»: regole brevi, nomi esatti di classi e token e cosa non inventare mai."
  items:
    - title: Per le persone
      text: Il perché delle scelte, quando usare un elemento e quando no, esempi giusti e sbagliati.
    - title: Per gli agenti
      text: "Un file di regole (AGENTS.md), una versione Markdown accanto a ogni pagina, llms.txt e tutti i token in un file solo."
    - title: Un controllo automatico
      text: Legge una pagina e segnala ogni colore, spazio o dimensione scritto a mano.
    - title: Quando il sistema non basta
      text: "L'agente non improvvisa: usa la soluzione più vicina e dichiara cosa mancava. Le aggiunte le decide una persona."
  example: Bottone, regole per gli agenti
  always: Sempre
  alwaysItems:
    - Un solo bottone primary per vista.
    - Un testo che comincia con un verbo.
  never: Mai
  neverItems:
    - Mai colori, bordi o spazi personalizzati sul bottone.
    - Mai un div cliccabile al posto di un bottone.
  quote: Le regole che tengono coerente un team sono le stesse che servono a un agente.

tokens:
  label: Token e temi
  intro: Tre livelli, dal valore grezzo al componente. Light e Dark mode usano gli stessi nomi; cambia solo il valore. Formato standard W3C Design Tokens.
  levels:
    - name: Primitivo
      text: Il valore grezzo. Non si usa direttamente.
      token: abete 500
      code: color.abete.500
    - name: Semantico
      text: Un valore con un significato.
      token: accento
      code: color.accent.default
    - name: Componente
      text: Il valore di un componente. Punta solo ai semantici.
      token: sfondo del bottone primary
      code: button.primary.bg
  dark: "In Dark mode lo stesso accento punta a un altro verde, abete 300: il bottone non cambia nome, cambia valore."

experiment:
  label: Grigna DS alla prova con due agenti AI
  intro:
    - "Un design system ben strutturato plasma quello che un agente può costruire? Ho voluto stressare l'ideazione UI di una pagina di esempio costruita da due agenti, con la stessa richiesta: prevedere un elenco di schede e renderle filtrabili in base alle informazioni contenute."
    - "Uno lavorava senza un framework a disposizione, l'altro utilizzando Grigna. Entrambi privi di dati reali. Sono emerse parecchie riflessioni interessanti, che ho voluto riportare qui."
  honest: "Va detto con onestà: la pagina senza sistema era più bella, più ricca e «da prodotto». Il sistema non l'ha resa più bella. L'ha resa coerente, verificabile e onesta."
  without: Nessun framework di riferimento
  with: Con Grigna
  rows:
    - label: "Valori scritti a mano, fuori da ogni sistema: colori, spazi, dimensioni"
      without: "142"
      with: "0"
    - label: Colori diversi scritti a mano
      without: "44"
      with: "0"
    - label: Dimensioni del testo diverse
      without: "11"
      with: "Le 9 di Grigna"
    - label: Contenuti
      without: "14 schede con luoghi veri e informazioni inventate, presentate come reali"
      with: "Nessun dato inventato: testi segnaposto ben riconoscibili e un avviso in cima alla pagina che dice che i dati non sono reali"
  shotWithout: "La pagina dell'agente senza framework: curata, ma con contenuti e stati inventati e nessun avviso."
  shotWith: "La pagina dell'agente con Grigna: più spoglia, con segnaposto dichiarati in cima alla pagina."
  learned: "La prova ha trovato anche i limiti di Grigna. L'agente ha elencato da solo cosa mancava invece di improvvisare. Da lì sono nati **sei interventi**, già applicati al sistema:"
  improvements:
    - title: Un componente per i segnaposto.
      text: "L'agente aveva copiato a schermo gli esempi della documentazione, con le graffe del codice: «{distanza} km». Ora c'è un componente Segnaposto con un formato chiaro, e una regola: le graffe non arrivano mai a schermo."
    - title: I token di layout che mancavano.
      text: "Per la larghezza massima della pagina e quella minima delle schede non c'era un token: l'agente ha scritto i valori a mano e l'ha dichiarato. Ora sono token del sistema, con un punto di rottura a 768px."
    - title: Componenti che si nascondono davvero.
      text: "Alcuni componenti restavano visibili anche con l'attributo hidden. Ora tutti lo rispettano."
    - title: Un filtro che regge molte opzioni.
      text: "Un gruppo con 16 opzioni era troppo lungo da leggere e da usare. Ora c'è uno schema: le opzioni si dividono in gruppi e si mostra solo quello che serve."
    - title: Un controllo automatico più severo.
      text: "Il controllo non aveva visto due misure scritte a mano dall'agente con Grigna. Ora verifica anche larghezze, griglie e graffe rimaste a schermo."
    - title: Regole di lavoro più precise.
      text: "L'agente aveva aggiornato da solo i file di lavoro del sistema anche durante la prova. Ora lo fa solo quando lavora davvero su Grigna."
  quote: Una demo convincente non è una base su cui costruire.

lessons:
  label: Cosa ho imparato
  intro: "Grigna è nato come progetto personale, per capire cosa cambia quando un design system ha due lettori: le persone e gli agenti AI."
  points:
    - title: Scrivere per un agente costringe a decidere.
      text: "Molte scelte che davo per scontate, come non usare un componente o cosa mostrare se un dato manca, ho dovuto scriverle nero su bianco. Le regole sono diventate quindi regole chiare anche per le persone."
    - title: I numeri spostano la conversazione dal gusto ai fatti.
      text: "142 valori scritti a mano contro zero dicono più di qualsiasi opinione sul perché serve un sistema. È un argomento che posso portare a un team o a uno stakeholder."
    - title: Un agente è un tester instancabile del sistema.
      text: "Invece di improvvisare, l'agente ha dichiarato cosa mancava. Ogni sua difficoltà è diventata un intervento sul sistema, come farebbe un buon test d'uso."

closing:
