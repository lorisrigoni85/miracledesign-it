# Grigna case study in English: an adaptation of it.yaml, approved by Loris on 31/10/2026.
# No dates, no Quotik. Source: ~/Documents/design-system.

meta:
  title: Grigna, a design system for people and AI agents — Loris Rigoni | Miracle Design
  description: "Grigna, Loris Rigoni's design system for designers and AI agents: principles, components and their states, accessibility by construction and an experiment with and without the system."

name: Grigna
label: Design system · personal project
title: Grigna. A design system for designers and AI agents.
lead: "A design system serves designers first: it gives designers and developers the same rules, the same names and the same components. Grigna adds a second reader, the AI agent. The rules that keep a team's work consistent are the same ones that stop an agent from inventing colours, spacing and components."
siteLabel: Explore Grigna
demoTitle: Grigna components, live examples
facts:
  - value: 3 tiers
    label: of tokens, from the raw starting value to the multi-purpose component
  - value: 7 initial components
    label: in HTML and CSS, no framework, ready to grow
  - value: Light and Dark mode
    label: same names, different values

principles:
  label: Six principles
  intro: "Six ideas guide Grigna: the principles that always underpin both the design work and the use of the initial components. When a more specific rule doesn't cover a case, you decide from here."
  items:
    - title: The system is the context.
      text: Every choice is written down, has a name and can be checked by a script, not just by an expert eye.
    - title: Clean and bright.
      text: Light surfaces, plenty of space, a single accent colour. The UI serves the content, nothing else.
    - title: Colour always means something.
      text: "Fir green signals action. The other colours are only there to give feedback: success, warning, error or information."
    - title: Accessible by construction.
      text: Contrast, touch area and focus are checked rules, not good intentions.
    - title: Fewer choices, more consistency.
      text: "Spaces, sizes and colours are chosen with a rationale. If a value is missing, it isn't hand-written: it goes into the system, for everyone."
    - title: No invented content.
      text: "Examples use clear placeholders. And missing data isn't shown: no dashes, “n/a” or estimates."

components:
  label: Components
  intro: "Seven initial components, in HTML and CSS with no framework. Every documentation page has the same sections in the same order: live example, when to use it and when not, code, variants and states, tokens, accessibility, rules for agents."
  hint: Pick a component and look at its states. The examples are real, not images.
  theme: Theme
  light: Light
  dark: Dark
  quote: Every component also says when not to use it.

a11y:
  label: Accessible by construction
  intro: "In Grigna accessibility isn't the result of a final review: it's written into the tokens from the start and checked by the build."
  items:
    - title: Contrast
      text: 4.5:1 for text, 3:1 for borders and graphics. If a pairing fails, the build stops.
    - title: Touch area
      text: At least 44px for every interactive element.
    - title: Text
      text: Body text never goes below 16px.
    - title: Focus
      text: Always visible from the keyboard, with the same green ring everywhere.
    - title: Native HTML
      text: "A button for actions, a link for navigation, a label for every field, details for the accordion."
    - title: Never colour alone
      text: Every meaningful colour comes with text, an icon or a shape.
  toggle: View without colour
  toggleHint: "Try removing the colours: the badge status, the active filter and the error still make sense, thanks to text, check mark and message."
  quote: Information carried by colour alone doesn't reach everyone.

readers:
  label: A DS for AI agents too
  intro: "Documentation pages end with a “For agents” section: short rules, exact class and token names, and what never to invent."
  items:
    - title: For people
      text: Why each choice was made, when to use an element and when not, right and wrong examples.
    - title: For agents
      text: "A rules file (AGENTS.md), a Markdown version next to every page, llms.txt and all tokens in a single file."
    - title: An automatic check
      text: It reads a page and flags every hand-written colour, space or size.
    - title: When the system isn't enough
      text: "The agent doesn't improvise: it uses the closest option and says what was missing. A person decides what gets added."
  example: Button, rules for agents
  always: Always
  alwaysItems:
    - Only one primary button per view.
    - Text that starts with a verb.
  never: Never
  neverItems:
    - Never custom colours, borders or spacing on the button.
    - Never a clickable div instead of a button.
  quote: The rules that keep a team consistent are the same ones an agent needs.

tokens:
  label: Tokens and themes
  intro: Three tiers, from raw value to component. Light and Dark mode use the same names; only the value changes. Standard W3C Design Tokens format.
  levels:
    - name: Primitive
      text: The raw value. Never used directly.
      token: fir 500
      code: color.abete.500
    - name: Semantic
      text: A value with a meaning.
      token: accent
      code: color.accent.default
    - name: Component
      text: A component's value. It only points to semantic tokens.
      token: primary button background
      code: button.primary.bg
  dark: "In Dark mode the same accent points to another green, fir 300: the button keeps its name, only the value changes."

experiment:
  label: Grigna DS put to the test with two AI agents
  intro:
    - "Does a well-structured design system shape what an agent can build? I wanted to stress-test the UI ideation of a sample page built by two agents, with the same request: a list of cards that can be filtered by the information they contain."
    - "One worked with no framework available, the other with Grigna. Neither had real data. Quite a few interesting reflections came out of it, and I wanted to report them here."
  honest: "In all honesty: the page without the system looked better, richer and more “product-like”. The system didn't make it prettier. It made it consistent, verifiable and honest."
  without: No reference framework
  with: With Grigna
  rows:
    - label: "Hand-written values outside any system: colours, spaces, sizes"
      without: "142"
      with: "0"
    - label: Different hand-written colours
      without: "44"
      with: "0"
    - label: Different text sizes
      without: "11"
      with: "Grigna's 9"
    - label: Content
      without: "14 cards with real places and invented information, presented as real"
      with: "No invented data: clearly recognisable placeholder text and a notice at the top of the page saying the data isn't real"
  shotWithout: "The page by the agent with no framework: polished, but with invented content and statuses and no warning."
  shotWith: "The page by the agent with Grigna: plainer, with placeholders declared at the top of the page."
  learned: "The test also found Grigna's limits. The agent listed what was missing instead of improvising. That led to **six changes**, already applied to the system:"
  improvements:
    - title: A placeholder component.
      text: "The agent had copied the documentation's examples to the screen, code braces included: “{distance} km”. Now there's a Placeholder component with a clear format, and a rule: braces never reach the screen."
    - title: The missing layout tokens.
      text: "There was no token for the page's maximum width or the cards' minimum width: the agent hand-wrote the values and said so. Now they are system tokens, with a breakpoint at 768px."
    - title: Components that really hide.
      text: "Some components stayed visible even with the hidden attribute. Now they all respect it."
    - title: A filter that handles many options.
      text: "A group with 16 options was too long to read and use. Now there's a pattern: options are split into groups and only the relevant one is shown."
    - title: A stricter automatic check.
      text: "The check had missed two values hand-written by the agent with Grigna. Now it also checks widths, grids and braces left on screen."
    - title: Clearer working rules.
      text: "The agent had updated the system's working files on its own, even during the test. Now it only does so when actually working on Grigna."
  quote: A convincing demo is not a foundation to build on.

closing:
  button: Explore Grigna
